seed: 42
exp: kd_hybrid_tfd_conf
data_params:
  feature_root_dir: /path/to/ASPED_v.a
  embedding_dir: /path/to/teacher_embeddings
dataloader_params:
  batch_size: 64
  num_workers: 0
model:
  task: classification
  n_classes: 2
  token_dim: 128
  nhead: 4
  dropout: 0.2
  num_layers: 1
  optim:
    type: Adam
    args:
      lr: 0.0005
      weight_decay: 0.01
  kd:
    teacher_dim: 258
    query_agg_type: attention
    teacher_ckpt: placeholder
    kd_temperature: 3.0
    focal_loss: true
    focal_gamma: 2.0
    use_logit_kd: true
    use_uncertainty: false
    kd_weight: 1.0
    use_selective_kd: true
    confidence_threshold: 0.5
    feature_kd:
      enabled: true
      feat_kd_type: cosine
      teacher_feat_dim: 256
      student_feat_dim: 128
      proj_dim: 256
trainer:
  args:
    max_epochs: 2
    accelerator: gpu
    devices: [0]
    precision: 32
    deterministic: false
    accumulate_grad_batches: 1
    val_check_interval: 0.1
  early_stopping:
    monitor: val_quick/macro_accuracy
    patience: 10
    mode: max
    verbose: true
  logger:
    save_dir: work_dir/kd_hybrid_tfd_conf
    name: log
  checkpoint:
    dirpath: work_dir/kd_hybrid_tfd_conf
    filename: best-{epoch:02d}
    auto_insert_metric_name: false
    monitor: val_quick/macro_accuracy
    mode: max
    save_top_k: 1
