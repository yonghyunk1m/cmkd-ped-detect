# TAD-SP: Transferability-Aware Distillation with Signal Prior
# Uses aligned teacher embeddings

seed: 42
exp: kd_logit_tad_sp

data_params:
  feature_root_dir: "/media/ykim/Linux/ASPED_v1_npy"

dataloader_params:
  batch_size:  64
  num_workers: 0

model:
  type: "kd"
  task: "classification"
  token_dim:  128
  nhead:      4
  dropout:    0.2
  num_layers: 1
  n_classes:  2

  kd:
    teacher_dim: 258
    teacher_ckpt: "/media/backup_SSD/Yonghyun/PedestrianDetection_KD/work_dir/Teacher_existence/Session_6012023/epoch=77-step=8796424.ckpt"
    teacher_embed_dir: "/media/ykim/Linux/ASPEDv1_VideoEmbeddings_aligned"
    kd_temperature: 4.0
    use_logit_kd: true
    use_uncertainty: false
    kd_weight: 1.0
    focal_loss: true
    # TAD
    use_tad: true
    tad_mode: sp
    tad_sp_alpha: 100.0
    tad_sp_mu: 0.015

  optim:
    type: Adam
    args:
      lr:           0.0005
      weight_decay: 0.01

trainer:
  args:
    max_epochs:      1000
    accelerator:     gpu
    devices:         [0]
    precision:       32
    deterministic:   false
    val_check_interval: 0.1

  early_stopping:
    monitor:  val_quick/macro_accuracy
    patience: 50
    mode:     max
    verbose:  true

  logger:
    save_dir: &save_dir "work_dir/kd_logit_tad_sp"
    name: log

  checkpoint:
    dirpath: *save_dir
    filename: 'best-{epoch:02d}'
    auto_insert_metric_name: false
    monitor: val_quick/macro_accuracy
    mode:    max
    save_top_k: 1
