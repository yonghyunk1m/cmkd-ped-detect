# ============================================================
# CRD Binary Classification Config
# Teacher: Mask2Former query embeddings → frozen MLP → binary
# Student: VGGish + Transformer (binary pedestrian detection)
# KD loss: CE + LogitKD + CRD (InfoNCE contrastive feature KD)
# ============================================================

seed: 42
exp: kd_crd_binary

# ---- Data -------------------------------------------------------
data_params:
  feature_root_dir: "/media/ykim/Linux/ASPED_v1_npy"
  embedding_dir:    "/media/ykim/Linux/ASPEDv1_VideoEmbeddings"

dataloader_params:
  batch_size:  64
  num_workers: 0

# ---- Model ------------------------------------------------------
model:
  task:       "classification"
  n_classes:  2

  token_dim:  128
  nhead:      4
  dropout:    0.2
  num_layers: 1

  optim:
    type: Adam
    args:
      lr:           0.0005
      weight_decay: 0.01

  kd:
    teacher_dim:      258
    query_agg_type:   "attention"
    teacher_dir: work_dir/teacher_video_only   # per-fold LOSO teacher; train_kd.py picks <teacher_dir>/<test_session>/best-*.ckpt
    kd_temperature:   3.0
    focal_loss:       true
    focal_gamma:      2.0
    feature_kd:
      enabled:          true
      feat_kd_type:     crd           # InfoNCE contrastive
      crd_temperature:  0.07
      teacher_feat_dim: 256
      student_feat_dim: 128
      proj_dim:         256

# ---- Trainer ----------------------------------------------------
trainer:
  args:
    max_epochs:      3
    accelerator:     gpu
    devices:         [0]
    precision:       32
    deterministic:   false
    accumulate_grad_batches: 1
    val_check_interval: 0.1

  early_stopping:
    monitor:  val_quick/macro_accuracy
    patience: 20
    mode:     max
    verbose:  true

  logger:
    save_dir: &save_dir "work_dir/kd_crd_binary"
    name: log

  checkpoint:
    dirpath: *save_dir
    filename: 'best-{epoch:02d}-{val_quick/macro_accuracy:.4f}'
    auto_insert_metric_name: false
    monitor: val_quick/f1
    mode:    max
    save_top_k: 1
